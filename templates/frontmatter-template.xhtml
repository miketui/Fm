<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="en" xml:lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Frontmatter Page Title</title>
  <link rel="stylesheet" type="text/css" href="../styles/fonts.css"/>
  <link rel="stylesheet" type="text/css" href="../styles/style.css"/>
  <link rel="stylesheet" type="text/css" href="../styles/print.css" media="print"/>
</head>
<body class="frontmatter-page">
  <main epub:type="frontmatter" role="main">
    
    <!-- TITLE PAGE VARIANT -->
    <section class="frontmatter-shell title-page" aria-label="Title Page">
      <h1 class="frontmatter-title" epub:type="title">BOOK TITLE</h1>
      <h2 class="subtitle" epub:type="subtitle">Book Subtitle</h2>
      
      <div class="frontmatter-divider" aria-hidden="true"></div>
      
      <div class="author" epub:type="creator">Author Name</div>
      
      <div class="publisher-info" epub:type="publisher">Publisher Name</div>
      <div class="publisher-info">City, State</div>
      <div class="publisher-info">Year</div>
    </section>
    
    <!-- COPYRIGHT PAGE VARIANT -->

      <p>ISBN: XXX-X-XXXX-XXXX-X</p>
      <p>Publisher Name<br/>
      Address Line 1<br/>
      Address Line 2</p>
    </section>
    -->
    
    <!-- TABLE OF CONTENTS VARIANT -->

        <div class="toc-divider-img" aria-hidden="true"></div>
        <li>
          <span class="toc-entry-title">Chapter Title</span>

        </li>
      </ul>
    </section>
    -->

    <!-- Uncomment for preface page:
